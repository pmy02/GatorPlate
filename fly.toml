# Fly.io app for GatorPlate: one always-on machine, one worker, a 1 GB volume at /data.
# Secrets (GP_LLM_API_KEY, GP_GATEWAY_SECRET, GP_CONSOLE_PASSCODE, GP_SESSION_SECRET, GP_CARD_DELIVERY,
# GP_DEMO_PHONE_DISPLAY) are set with `fly secrets set`, never written here.
app = "gatorplate"
primary_region = "iad"

[build]

[env]
  GP_ENV = "prod"
  GP_PUBLIC_BASE_URL = "https://gatorplate.fly.dev"
  GP_DB_PATH = "/data/gatorplate.db"
  GP_LLM_PROVIDER = "anthropic"
  # Hedge a slow model call with a second identical request at about the warm median latency (about half the turns).
  GP_LLM_HEDGE_MS = "1250"
  GP_DEBUG_KEYS = "0"
  GP_DEMO_MODE = "1"
  GP_LIVE_TRANSCRIPT = "1"
  GP_TZ = "America/Los_Angeles"

[http_service]
  # GatorPlate keeps call state and the live view in one process, so its single machine never sleeps on idle
  # and is always counted as running.
  auto_stop_machines = "off"
  min_machines_running = 1
  # uvicorn listens here inside the machine (see the Dockerfile).
  internal_port = 8080
  # After a deploy or a crash, the next request starts the machine again.
  auto_start_machines = true
  # Plain-HTTP requests are redirected: the card, console and talk pages are served over HTTPS only.
  force_https = true

  # Health check: the Brain API's unauthenticated health route (docs/BRAIN_API.md).
  [[http_service.checks]]
    path = "/v1/health"
    method = "GET"
    # Every 15 s, 5 s to answer; the first 10 s after a start are not counted.
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

[mounts]
  source = "gp_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
